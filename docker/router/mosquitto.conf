# ═══════════════════════════════════════════════════════════════════════════════
# VESPER MQTT Broker (Eclipse Mosquitto)
#
# Runs on the Mininet-WiFi AP gateway (192.168.4.1).
# Configuration mirrors a real-world IoT MQTT deployment:
#   - Plaintext listener for LAN devices (port 1883)
#   - TLS listener for secure communication (port 8883)
#   - Per-device ACLs (optional, controlled by VESPER_MQTT_AUTH env)
#   - Connection rate limiting
#   - Message size limits (matching real IoT platforms)
# ═══════════════════════════════════════════════════════════════════════════════

# ── Plaintext listener (LAN only) ────────────────────────────────────────────
# Real IoT devices typically use plaintext MQTT on the local network.
# The firewall ensures only LAN clients (192.168.4.0/24) can reach this port.
listener 1883 0.0.0.0
protocol mqtt

# ── TLS listener (for SmartThings cloud / external) ──────────────────────────
# Uncomment when TLS certificates are provisioned:
# listener 8883 0.0.0.0
# protocol mqtt
# cafile /etc/vesper/certs/ca.crt
# certfile /etc/vesper/certs/server.crt
# keyfile /etc/vesper/certs/server.key
# tls_version tlsv1.2
# require_certificate false

# ── Authentication ────────────────────────────────────────────────────────────
# Default: anonymous (matches many consumer IoT hubs).
# For production-like testing, set VESPER_MQTT_AUTH=1 and provide password_file.
allow_anonymous true
# password_file /etc/vesper/mosquitto_passwd
# acl_file /etc/vesper/mosquitto_acl

# ── Connection limits (match real-world MQTT brokers) ─────────────────────────
max_connections 64
# Max 20 new connections per second (prevents MQTT connection floods)
# (mosquitto >= 2.0.18)
# max_connections_per_second 20

# ── Message limits (match SmartThings / AWS IoT Core defaults) ────────────────
# Maximum payload size: 128 KB (AWS IoT Core limit is 128 KB)
message_size_limit 131072
# Maximum inflight QoS 1/2 messages per client
max_inflight_messages 20
# Maximum queued messages per client
max_queued_messages 1000

# ── Keepalive ─────────────────────────────────────────────────────────────────
# Real IoT devices use 60s keepalive; broker enforces 1.5x
max_keepalive 90

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /var/log/vesper/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /var/lib/vesper/
autosave_interval 300

# ── Retained messages (important for IoT state sync) ─────────────────────────
# Real MQTT brokers allow retained messages for device state
retain_available true

# ── Topic structure ───────────────────────────────────────────────────────────
# Expected topics:
#   vesper/<device-id>/state    — device publishes state updates
#   vesper/<device-id>/cmd/#    — bridge publishes commands to device
#   vesper/<device-id>/telemetry — sensor readings
#   vesper/system/status        — system-wide announcements
#
# ACL (when authentication is enabled):
# ─────────────────────────────────────────────────────────────────────────────
# user vesper-bridge
# topic readwrite vesper/#
#
# pattern readwrite vesper/%u/#
# ─────────────────────────────────────────────────────────────────────────────
